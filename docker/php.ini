; ============================================================
;  ExamHub - production PHP configuration
;
;  Loaded from conf.d, so it overrides the base image defaults.
;  Settings the application already controls through its own
;  configuration are set here too, so that a request which dies
;  before the bootstrap runs still fails safely.
; ============================================================

; ── Disclosure ──────────────────────────────────────────────
; Nothing about a failure belongs in the response body. The
; application's error handler makes the same decision, but it
; can only do so once it is running - a parse error in the
; bootstrap itself is reported by PHP, before any of it has run.
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_reporting       = E_ALL

; Stop advertising PHP and its exact version in the
; X-Powered-By header. Free reconnaissance otherwise.
expose_php = Off

; ── Sessions ────────────────────────────────────────────────
; The application sets these explicitly at runtime. They are
; repeated here so the defaults are already correct rather than
; relied upon to be overridden.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.sid_length      = 32
session.sid_bits_per_character = 5

; ── Limits ──────────────────────────────────────────────────
; This application renders pages and runs small queries; it has
; no uploads and no long-running jobs. Generous limits would
; only mean a runaway request takes longer to be stopped and
; more memory with it.
memory_limit          = 128M
max_execution_time    = 30
post_max_size         = 2M
upload_max_filesize   = 2M
max_input_vars        = 500

; ── Opcache ─────────────────────────────────────────────────
; Not enabled by default in the base image. Without it every
; request recompiles every PHP file it touches, which on a page
; pulling in a controller, a service, two repositories and a
; layout is most of the request.
;
; validate_timestamps is off because the filesystem cannot
; change under a running container: a new version of the code is
; a new container. Leaving it on would buy a stat() per file per
; request for a file that cannot have changed.
opcache.enable                = 1
opcache.enable_cli            = 0
opcache.memory_consumption    = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps   = 0
opcache.save_comments         = 1

; ── Time ────────────────────────────────────────────────────
; The application calls date_default_timezone_set('UTC') itself
; and stores every timestamp it controls in UTC. This keeps
; anything that runs before that in the same zone.
date.timezone = UTC
