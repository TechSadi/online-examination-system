# ============================================================
#  ExamHub - container virtual host
#
#  Replaces the base image's 000-default.conf.
#
#  The port is rewritten by docker/entrypoint.sh before Apache
#  starts, because Render assigns it at runtime through $PORT
#  and Listen cannot read an environment variable.
# ============================================================

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # ── .htaccess ───────────────────────────────────────────
    # AllowOverride All is load-bearing, not a convenience. The
    # base image inherits AllowOverride None from Debian's
    # apache2.conf, which makes Apache ignore .htaccess
    # entirely - and .htaccess is what denies app/, bin/,
    # database/ and storage/ over HTTP. Without this line the
    # container would serve the source tree, the SQL and the
    # environment file to anyone who asked.
    #
    # Keeping the rules in .htaccess rather than copying them
    # here means local Apache and the container enforce one set
    # of rules that cannot drift apart.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Error pages ─────────────────────────────────────────
    # The .htaccess rewrite catches a URL naming no file.
    # These catch what Apache raises before a rewrite can run:
    # a denied path, a PHP process that died mid-request.
    #
    # A root-relative path is correct here and only here -
    # inside the container the application is the document
    # root, which is not true under XAMPP.
    ErrorDocument 400 /error.php
    ErrorDocument 403 /error.php
    ErrorDocument 404 /error.php
    ErrorDocument 405 /error.php
    ErrorDocument 500 /error.php
    ErrorDocument 503 /error.php

    # ── Static assets ───────────────────────────────────────
    # Every asset URL carries the file's modification time, so
    # a changed file is a changed URL and a long max-age can
    # never serve a stale one. immutable stops a reload
    # revalidating what cannot have changed.
    <Directory /var/www/html/public/assets>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # ── Logging ─────────────────────────────────────────────
    # To the container's own streams, which the platform
    # collects. A file inside the container would be discarded
    # on the next deploy and readable by nobody before then.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined

    # The platform terminates TLS and forwards the real scheme
    # in X-Forwarded-Proto. The application reads it only when
    # APP_TRUST_PROXY is set, which is what makes the Secure
    # cookie flag and HSTS turn themselves on in production.
</VirtualHost>

# Do not advertise the server version or the OS in responses or
# on generated pages. It is free reconnaissance for anyone
# matching a version against a list of known issues.
ServerTokens Prod
ServerSignature Off

# The application is not a proxy and must never act as one.
TraceEnable Off
